<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="big-glow">
      <feGaussianBlur stdDeviation="30" result="blur"/>
    </filter>
    <filter id="mid-glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
    </filter>

    <!-- Premium Gold/Emerald Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7B733"/>
      <stop offset="100%" stop-color="#FC4A1A"/>
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#11998e"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F7B733">
        <animate attributeName="stop-color" values="#F7B733;#FC4A1A;#f953c6;#F7B733" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#f953c6">
        <animate attributeName="stop-color" values="#f953c6;#38ef7d;#F7B733;#f953c6" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#38ef7d">
        <animate attributeName="stop-color" values="#38ef7d;#F7B733;#FC4A1A;#38ef7d" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Shimmer for divider -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F7B733" stop-opacity="0">
        <animate attributeName="offset" values="-0.5;1" dur="2.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#F7B733" stop-opacity="1">
        <animate attributeName="offset" values="0;1.5" dur="2.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#F7B733" stop-opacity="0">
        <animate attributeName="offset" values="0.5;2" dur="2.5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Radial glow for center -->
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F7B733" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F7B733" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep dark background -->
  <rect width="900" height="450" fill="#0a0a0f" rx="12"/>

  <!-- Subtle grid -->
  <g opacity="0.04">
    <line x1="0" y1="0" x2="0" y2="450" stroke="#F7B733" stroke-width="0.5"><animate attributeName="x1" values="0;900" dur="60s" repeatCount="indefinite"/><animate attributeName="x2" values="0;900" dur="60s" repeatCount="indefinite"/></line>
    <line x1="0" y1="0" x2="900" y2="0" stroke="#38ef7d" stroke-width="0.5"><animate attributeName="y1" values="0;450" dur="45s" repeatCount="indefinite"/><animate attributeName="y2" values="0;450" dur="45s" repeatCount="indefinite"/></line>
  </g>

  <!-- Large ambient orbs -->
  <ellipse cx="200" cy="120" rx="250" ry="200" fill="#F7B733" filter="url(#big-glow)" opacity="0.06">
    <animate attributeName="cx" values="200;280;200" dur="18s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="120;180;120" dur="14s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="700" cy="350" rx="200" ry="180" fill="#38ef7d" filter="url(#big-glow)" opacity="0.05">
    <animate attributeName="cx" values="700;620;700" dur="16s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="450" cy="225" rx="180" ry="150" fill="#f953c6" filter="url(#big-glow)" opacity="0.04">
    <animate attributeName="opacity" values="0.02;0.06;0.02" dur="8s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ═══ TERMINAL WINDOW ═══ -->
  <g transform="translate(50, 30)">
    <rect width="380" height="200" rx="10" fill="#12121a" stroke="#1e1e2e" stroke-width="1.5"/>
    <!-- Window dots -->
    <circle cx="18" cy="16" r="5" fill="#ff5f57"/>
    <circle cx="36" cy="16" r="5" fill="#febc2e"/>
    <circle cx="54" cy="16" r="5" fill="#28c840"/>
    <text x="190" y="19" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="11">tanishq@workspace</text>
    <rect x="0" y="30" width="380" height="1" fill="#1e1e2e"/>

    <!-- Terminal content -->
    <text x="15" y="55" fill="#6c7086" font-family="monospace" font-size="12">❯</text>
    <text x="30" y="55" fill="#F7B733" font-family="monospace" font-size="12" font-weight="bold">neofetch</text>

    <text x="15" y="82" fill="#38ef7d" font-family="monospace" font-size="11">OS</text>
    <text x="55" y="82" fill="#cdd6f4" font-family="monospace" font-size="11">Engineer v4.0</text>

    <text x="15" y="102" fill="#38ef7d" font-family="monospace" font-size="11">Host</text>
    <text x="55" y="102" fill="#cdd6f4" font-family="monospace" font-size="11">AI × Full-Stack</text>

    <text x="15" y="122" fill="#38ef7d" font-family="monospace" font-size="11">Shell</text>
    <text x="55" y="122" fill="#cdd6f4" font-family="monospace" font-size="11">TypeScript / Python / Go</text>

    <text x="15" y="142" fill="#38ef7d" font-family="monospace" font-size="11">Uptime</text>
    <text x="55" y="142" fill="#cdd6f4" font-family="monospace" font-size="11">Building since 2022</text>

    <text x="15" y="162" fill="#38ef7d" font-family="monospace" font-size="11">Pkgs</text>
    <text x="55" y="162" fill="#cdd6f4" font-family="monospace" font-size="11">React Next.js Node PyTorch</text>

    <!-- Color palette blocks -->
    <rect x="15" y="176" width="16" height="12" rx="2" fill="#f38ba8"/>
    <rect x="35" y="176" width="16" height="12" rx="2" fill="#fab387"/>
    <rect x="55" y="176" width="16" height="12" rx="2" fill="#f9e2af"/>
    <rect x="75" y="176" width="16" height="12" rx="2" fill="#a6e3a1"/>
    <rect x="95" y="176" width="16" height="12" rx="2" fill="#89b4fa"/>
    <rect x="115" y="176" width="16" height="12" rx="2" fill="#cba6f7"/>
    <rect x="135" y="176" width="16" height="12" rx="2" fill="#f5c2e7"/>
    <rect x="155" y="176" width="16" height="12" rx="2" fill="#F7B733"/>
  </g>

  <!-- ═══ CODE EDITOR WINDOW ═══ -->
  <g transform="translate(470, 30)">
    <rect width="380" height="200" rx="10" fill="#12121a" stroke="#1e1e2e" stroke-width="1.5"/>
    <circle cx="18" cy="16" r="5" fill="#ff5f57"/>
    <circle cx="36" cy="16" r="5" fill="#febc2e"/>
    <circle cx="54" cy="16" r="5" fill="#28c840"/>
    <text x="190" y="19" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="11">mission.ts</text>
    <rect x="0" y="30" width="380" height="1" fill="#1e1e2e"/>

    <!-- Line numbers -->
    <text x="15" y="55" fill="#45475a" font-family="monospace" font-size="11">1</text>
    <text x="15" y="75" fill="#45475a" font-family="monospace" font-size="11">2</text>
    <text x="15" y="95" fill="#45475a" font-family="monospace" font-size="11">3</text>
    <text x="15" y="115" fill="#45475a" font-family="monospace" font-size="11">4</text>
    <text x="15" y="135" fill="#45475a" font-family="monospace" font-size="11">5</text>
    <text x="15" y="155" fill="#45475a" font-family="monospace" font-size="11">6</text>
    <text x="15" y="175" fill="#45475a" font-family="monospace" font-size="11">7</text>

    <!-- Code syntax highlighted -->
    <text x="40" y="55" fill="#cba6f7" font-family="monospace" font-size="11">const</text>
    <text x="80" y="55" fill="#89b4fa" font-family="monospace" font-size="11">mission</text>
    <text x="130" y="55" fill="#89dceb" font-family="monospace" font-size="11">= {</text>

    <text x="50" y="75" fill="#a6e3a1" font-family="monospace" font-size="11">goal:</text>
    <text x="95" y="75" fill="#f9e2af" font-family="monospace" font-size="11">"ship things that matter"</text>
    <text x="310" y="75" fill="#6c7086" font-family="monospace" font-size="11">,</text>

    <text x="50" y="95" fill="#a6e3a1" font-family="monospace" font-size="11">fuel:</text>
    <text x="95" y="95" fill="#f9e2af" font-family="monospace" font-size="11">"curiosity + coffee"</text>
    <text x="270" y="95" fill="#6c7086" font-family="monospace" font-size="11">,</text>

    <text x="50" y="115" fill="#a6e3a1" font-family="monospace" font-size="11">stack:</text>
    <text x="100" y="115" fill="#89dceb" font-family="monospace" font-size="11">[</text>
    <text x="108" y="115" fill="#f9e2af" font-family="monospace" font-size="11">"AI"</text>
    <text x="135" y="115" fill="#6c7086" font-family="monospace" font-size="11">,</text>
    <text x="142" y="115" fill="#f9e2af" font-family="monospace" font-size="11">"Full-Stack"</text>
    <text x="232" y="115" fill="#6c7086" font-family="monospace" font-size="11">,</text>
    <text x="239" y="115" fill="#f9e2af" font-family="monospace" font-size="11">"Systems"</text>
    <text x="305" y="115" fill="#89dceb" font-family="monospace" font-size="11">]</text>
    <text x="312" y="115" fill="#6c7086" font-family="monospace" font-size="11">,</text>

    <text x="50" y="135" fill="#a6e3a1" font-family="monospace" font-size="11">status:</text>
    <text x="110" y="135" fill="#f9e2af" font-family="monospace" font-size="11">"building"</text>
    <text x="190" y="135" fill="#6c7086" font-family="monospace" font-size="11">,</text>

    <text x="40" y="155" fill="#89dceb" font-family="monospace" font-size="11">};</text>

    <text x="40" y="175" fill="#cba6f7" font-family="monospace" font-size="11">export default</text>
    <text x="155" y="175" fill="#89b4fa" font-family="monospace" font-size="11">mission</text>
    <text x="200" y="175" fill="#89dceb" font-family="monospace" font-size="11">;</text>

    <!-- Blinking cursor -->
    <rect x="210" y="163" width="7" height="14" fill="#F7B733">
      <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ═══ NAME SECTION ═══ -->
  <text x="450" y="305" text-anchor="middle" fill="url(#name-grad)" font-family="sans-serif" font-size="52" font-weight="900" letter-spacing="-2">
    TANISHQ KATIYAR
  </text>

  <!-- Subtitle -->
  <text x="450" y="340" text-anchor="middle" fill="#6c7086" font-family="sans-serif" font-size="15" letter-spacing="6">
    AI  ·  FULL-STACK  ·  SYSTEMS
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Shimmer line under name -->
  <line x1="200" y1="360" x2="700" y2="360" stroke="url(#shimmer)" stroke-width="2" opacity="0.5"/>
  <line x1="200" y1="360" x2="700" y2="360" stroke="#1e1e2e" stroke-width="1"/>

  <!-- ═══ ORBITING PARTICLES ═══ -->
  <g filter="url(#glow)">
    <!-- Gold particle - figure-8 -->
    <circle r="3.5" fill="#F7B733">
      <animateMotion dur="8s" repeatCount="indefinite" path="M 100,380 C 250,350 350,420 450,380 C 550,340 650,410 800,380"/>
    </circle>
    <!-- Emerald particle -->
    <circle r="3" fill="#38ef7d">
      <animateMotion dur="10s" repeatCount="indefinite" path="M 800,400 C 650,370 550,430 450,400 C 350,370 250,430 100,400"/>
    </circle>
    <!-- Pink particle -->
    <circle r="2.5" fill="#f953c6">
      <animateMotion dur="12s" repeatCount="indefinite" path="M 200,280 C 350,260 500,300 650,270 C 700,265 750,290 800,280"/>
    </circle>
    <!-- Coral particle -->
    <circle r="2" fill="#FC4A1A" opacity="0.8">
      <animateMotion dur="15s" repeatCount="indefinite" path="M 50,250 C 200,200 400,300 600,230 C 700,200 800,260 850,240"/>
    </circle>
  </g>

  <!-- Status indicator dots -->
  <g transform="translate(370, 410)">
    <circle cx="0" cy="0" r="4" fill="#38ef7d">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="12" y="4" fill="#6c7086" font-family="monospace" font-size="11">open to collaborate</text>

    <circle cx="175" cy="0" r="4" fill="#F7B733">
      <animate attributeName="r" values="3;5;3" dur="2s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <text x="187" y="4" fill="#6c7086" font-family="monospace" font-size="11">shipping daily</text>
  </g>

</svg>
