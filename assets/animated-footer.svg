<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="100%" height="150">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-small" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#5773FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#FF007A" stop-opacity="0" />
    </linearGradient>

    <style>
      .text-small { font-family: 'Inter', -apple-system, sans-serif; font-size: 12px; font-weight: 400; fill: #8b949e; letter-spacing: 2px; }
      
      /* Wave Animation */
      @keyframes wave {
        0% { transform: translateX(0) translateZ(0) scaleY(1); }
        50% { transform: translateX(-25%) translateZ(0) scaleY(0.5); }
        100% { transform: translateX(-50%) translateZ(0) scaleY(1); }
      }
      .wave {
        animation: wave 10s cubic-bezier(0.36, 0.45, 0.63, 0.53) infinite;
        transform: translate3d(0, 0, 0);
      }
      .wave-2 {
        animation: wave 15s cubic-bezier(0.36, 0.45, 0.63, 0.53) infinite;
        animation-direction: reverse;
        transform: translate3d(0, 0, 0);
      }
    </style>
  </defs>

  <rect width="1000" height="150" fill="#09090b" rx="15" />
  
  <!-- Glowing Divider Line -->
  <rect x="100" y="20" width="800" height="1" fill="url(#line-grad)" filter="url(#glow-small)" />
  
  <!-- Animated Waves at bottom -->
  <g transform="translate(0, 70)" opacity="0.3">
    <!-- Sine waves (approximate with Bezier curves) -->
    <path d="M 0 50 Q 125 10 250 50 T 500 50 T 750 50 T 1000 50 T 1250 50 T 1500 50 T 1750 50 T 2000 50" fill="none" stroke="#00F0FF" stroke-width="2" class="wave" />
    <path d="M 0 50 Q 125 90 250 50 T 500 50 T 750 50 T 1000 50 T 1250 50 T 1500 50 T 1750 50 T 2000 50" fill="none" stroke="#FF007A" stroke-width="2" class="wave-2" />
  </g>

  <!-- Text -->
  <text x="500" y="80" text-anchor="middle" class="text-small">DESIGNED &amp; ENGINEERED BY TANISHQ KATIYAR</text>
  
  <!-- Tech Nodes -->
  <circle cx="480" cy="110" r="3" fill="#00F0FF" filter="url(#glow-small)" />
  <circle cx="500" cy="110" r="3" fill="#5773FF" filter="url(#glow-small)" />
  <circle cx="520" cy="110" r="3" fill="#FF007A" filter="url(#glow-small)" />
</svg>
