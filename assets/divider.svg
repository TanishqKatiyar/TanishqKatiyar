<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 30" width="900" height="30">
  <rect width="900" height="30" fill="transparent"/>
  <!-- Center line -->
  <line x1="100" y1="15" x2="800" y2="15" stroke="#21262d" stroke-width="1"/>
  <!-- Scanning light -->
  <circle cx="100" cy="15" r="4" fill="#0ff" opacity="0.8">
    <animate attributeName="cx" values="100;800;100" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <!-- Trail -->
  <line x1="100" y1="15" x2="200" y2="15" stroke="#0ff" stroke-width="2" opacity="0.3">
    <animate attributeName="x1" values="100;700;100" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="200;800;200" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="4s" repeatCount="indefinite"/>
  </line>
</svg>
