<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="300">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="heavy-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#5773FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>

    <!-- CSS Animations -->
    <style>
      .title { font-family: 'Inter', -apple-system, sans-serif; font-size: 52px; font-weight: 800; fill: #ffffff; letter-spacing: -1px; }
      .subtitle { font-family: 'Inter', -apple-system, sans-serif; font-size: 20px; font-weight: 400; fill: #8b949e; letter-spacing: 0.5px; }
      .mono { font-family: 'Fira Code', 'Courier New', monospace; font-size: 14px; fill: #5773FF; }
      
      /* Orb animations */
      @keyframes float1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(30px, -40px); } }
      @keyframes float2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-40px, 20px); } }
      
      .orb-1 { animation: float1 12s ease-in-out infinite; }
      .orb-2 { animation: float2 15s ease-in-out infinite; }
      
      /* Ring animations */
      @keyframes spin { 100% { transform: rotate(360deg); } }
      @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
      @keyframes pulse-ring { 0%, 100% { stroke-width: 1; opacity: 0.3; } 50% { stroke-width: 3; opacity: 0.8; } }
      
      .ring-1 { transform-origin: 800px 150px; animation: spin 20s linear infinite; }
      .ring-2 { transform-origin: 800px 150px; animation: spin-reverse 25s linear infinite; }
      .ring-3 { transform-origin: 800px 150px; animation: spin 15s linear infinite; }
      
      /* Typing line */
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor { animation: blink 1s step-end infinite; }
      
      /* Data flow lines */
      @keyframes flow {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      .data-line {
        stroke-dasharray: 100 900;
        animation: flow 10s linear infinite;
      }
    </style>
  </defs>

  <!-- Dark Background -->
  <rect width="1000" height="300" fill="#09090b" rx="15" />
  
  <!-- Subtle Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  </pattern>
  <rect width="1000" height="300" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="150" r="120" fill="#00F0FF" filter="url(#heavy-glow)" opacity="0.15" class="orb-1" />
  <circle cx="800" cy="150" r="150" fill="#FF007A" filter="url(#heavy-glow)" opacity="0.15" class="orb-2" />

  <!-- Data Flow Lines (Background) -->
  <path d="M 0 50 Q 250 100 500 50 T 1000 50" fill="none" stroke="#5773FF" stroke-width="1" opacity="0.2" class="data-line" />
  <path d="M 0 250 Q 250 200 500 250 T 1000 250" fill="none" stroke="#FF007A" stroke-width="1" opacity="0.2" class="data-line" style="animation-duration: 8s; animation-direction: reverse;" />

  <!-- Text Content -->
  <g transform="translate(80, 130)">
    <text class="mono" y="-40">>&nbsp;INITIALIZING_WORKSPACE...</text>
    <text class="title">TANISHQ KATIYAR</text>
    <text class="subtitle" y="40">Building scalable AI &amp; Full-Stack systems</text>
    <rect x="365" y="18" width="12" height="24" fill="#00F0FF" class="cursor" />
  </g>

  <!-- Futuristic Animated Rings (Right side) -->
  <g filter="url(#glow)">
    <!-- Outer dashed ring -->
    <circle cx="800" cy="150" r="90" fill="none" stroke="#00F0FF" stroke-width="1" stroke-dasharray="4 8" class="ring-1" opacity="0.6" />
    
    <!-- Middle double ring -->
    <circle cx="800" cy="150" r="70" fill="none" stroke="url(#primary-grad)" stroke-width="2" stroke-dasharray="40 10 10 10" class="ring-2" />
    <circle cx="800" cy="150" r="65" fill="none" stroke="#5773FF" stroke-width="1" stroke-dasharray="20 5" class="ring-2" opacity="0.5" />
    
    <!-- Inner solid/dashed ring -->
    <circle cx="800" cy="150" r="45" fill="none" stroke="#FF007A" stroke-width="2" stroke-dasharray="100 20" class="ring-3" />
    
    <!-- Center Core -->
    <circle cx="800" cy="150" r="10" fill="#00F0FF" filter="url(#glow)" />
    <circle cx="800" cy="150" r="25" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.8">
      <animate attributeName="r" values="10; 40" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1; 0" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

</svg>
